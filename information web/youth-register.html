<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukal Youth Data | Youth Registration</title>
  <link rel="icon" type="image/png" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="youth-register">

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Bukal Youth Data Home">
        <img src="assets/logo.png" alt="Bukal Youth Data logo" />
        <span>
          <strong>Bukal Youth Data</strong>
          <small>Pagbilao, Quezon</small>
        </span>
      </a>
      <img src="assets/logo sk 2.png" alt="Second logo" style="height:35px;" />
    </div>
  </header>

  <div class="auth-body">
  <main class="auth-shell wide-auth">


    <section class="auth-card registration-card">
      <div class="auth-title">
        <span class="auth-icon people"></span>
        <div>
          <h1>Youth Registration</h1>
          <p>Create your profile to join the Bukal youth database</p>
        </div>
      </div>

      <form id="youthRegisterForm" class="form-grid">
        <h2>Account Information</h2>

        <label class="field full">
          <span>Full Name</span>
          <input type="text" name="fullName" placeholder="Juan Dela Cruz" required />
        </label>

        <label class="field">
          <span>Email</span>
          <input
          type="email"
           id="email"
           name="email"
           placeholder="your.email@example.com"
           required />
        </label>

        <label class="field">
          <span>Password</span>
          <input
          type="password"
          id="password"
          name="password"
           placeholder="Minimum 8 characters"
            minlength="8"
            required />
        </label>

        <label class="field">
          <span>Age</span>
          <input type="number" name="age" min="15" max="30" placeholder="25" required />
        </label>

        <label class="field">
          <span>Gender</span>
          <select name="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Prefer not to say</option>
          </select>
        </label>

        <label class="field full">
          <span>Address / Purok</span>
          <input type="text" name="address" placeholder="Street, Purok, Barangay Bukal" required />
        </label>

        <label class="field full">
          <span>Contact Number</span>
          <input type="tel" name="contact" placeholder="09XX XXX XXXX" required />
        </label>

        <h2>Education and Employment</h2>

        <label class="field">
          <span>Educational Attainment</span>
          <select name="education" required>
            <option value="">Select</option>
            <option>Elementary</option>
            <option>High School</option>
            <option>Senior High School</option>
            <option>College</option>
            <option>Vocational</option>
            <option>Graduate</option>
            <option>Out of School Youth</option>
          </select>
        </label>

        <label class="field">
          <span>Current Education Status</span>
          <select name="educationStatus" required>
            <option value="">Select</option>
            <option>Currently Studying</option>
            <option>Not Studying</option>
            <option>Graduated</option>
          </select>
        </label>

        <label class="field">
          <span>Employment Status</span>
          <select name="employment" required>
            <option value="">Select</option>
            <option>Student</option>
            <option>Employed</option>
            <option>Unemployed</option>
            <option>Self-employed</option>
          </select>
        </label>

        <label class="field">
          <span>Civic Participation</span>
          <select name="civic" required>
            <option value="">Select</option>
            <option>Active</option>
            <option>Occasional</option>
            <option>Not Active</option>
          </select>
        </label>

        <h2>Voter and Support Information</h2>

        <label class="field">
          <span>Voter Registration Status</span>
          <select name="voterStatus" required>
            <option value="">Select</option>
            <option>Registered Voter</option>
            <option>Not Registered</option>
          </select>
        </label>

        <label class="field">
          <span>New Voter Status</span>
          <select name="newVoter" required>
            <option value="">Select</option>
            <option>New Voter</option>
            <option>Existing Voter</option>
            <option>Not Applicable</option>
          </select>
        </label>

        <label class="field">
          <span>Voter Participation</span>
          <select name="voterParticipation" required>
            <option value="">Select</option>
            <option>Participated</option>
            <option>Not Participated</option>
            <option>Not Applicable</option>
          </select>
        </label>

        <label class="field">
          <span>Special Needs</span>
          <select name="specialNeeds" required>
            <option value="">Select</option>
            <option>No</option>
            <option>Yes</option>
          </select>
        </label>

        <label class="field full">
          <span>Specific Assistance Needed</span>
          <input type="text" name="assistance" placeholder="Type N/A if none" />
        </label>

        <h2>Skills and Interests</h2>

        <label class="field full">
          <span>Hobbies / Skills</span>
          <input type="text" name="hobbies" placeholder="Example: Dancing, music, drawing, coding" required />
        </label>

        <label class="field full">
          <span>Sports Interests</span>
          <input type="text" name="sports" placeholder="Example: Basketball, volleyball, badminton" required />
        </label>

        <div class="form-actions full">
          <button class="btn btn-primary full-btn" type="submit">Register</button>
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </form>
    </section>
  </main>
  </div>

  <script src="assets/app.js"></script>
  <script type="module" src="assets/youth-register.js"></script>
</body>
</html>
