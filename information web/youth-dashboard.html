<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukal Youth Data | Youth Dashboard</title>
  <link rel="icon" type="image/png" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="youth-dashboard" class="dashboard-body">

  <header class="dash-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Bukal Youth Data Home">
        <img src="assets/logo.png" alt="Bukal Youth Data logo" />
        <img src="assets/logo sk 2.png" alt="Second logo" style="height:35px;" />
        <span>
          <strong>Bukal Youth Data</strong>
          <small>Pagbilao, Quezon</small>
        </span>
      </a>
    </div>
    <div class="container dash-top">
      <div>
        <h1>Youth Dashboard</h1>
        <p id="youthWelcome">Welcome</p>
      </div>

      <button class="logout-btn" data-logout>↪ Logout</button>
    </div>
  </header>

  <main class="container dashboard-main">
    <section class="panel profile-panel">
      <div class="panel-heading profile-heading">
        <span class="profile-avatar"></span>

        <div>
          <h2>Your Profile</h2>
          <p>Manage your personal information</p>
        </div>

        <button class="btn btn-primary btn-sm right" id="editProfileBtn">✎ Edit Profile</button>
      </div>

      <div id="youthProfileView" class="profile-view"></div>
    </section>
  </main>

  <dialog id="profileDialog" class="modal-card">
    <form method="dialog" class="modal-inner" id="profileEditForm">
      <div class="modal-heading">
        <h2>Edit Youth Profile</h2>
        <button class="icon-btn" value="cancel" type="submit">×</button>
      </div>

       <label>
    Last Name
    <input type="text" name="lastName">
  </label>

  <label>
    Age
    <input type="number" name="age">
  </label>

  <label>
    Address
    <input type="text" name="address">
  </label>
</div>

      <div class="modal-actions">
        <button class="btn btn-muted" value="cancel" type="submit">Cancel</button>
        <button class="btn btn-primary" id="saveProfileBtn" value="default" type="button">Save Changes</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="assets/youth-check.js"></script>
  <script src="assets/app.js"></script>
  <script type="module" src="assets/youth-dashboard.js"></script>
</body>
</html>
