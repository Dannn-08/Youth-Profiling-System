<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bukal Youth Data | Login</title>

  <link rel="icon" type="image/png" href="assets/logosk.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="assets/style.css" />
</head>

<body data-page="login">

  <header class="site-header">

    <div class="container nav-wrap">

      <a
        class="brand"
        href="index.html"
        aria-label="Bukal Youth Data Home"
      >

        <img
          src="assets/logo.png"
          alt="Bukal Youth Data logo"
        />

        <img
          src="assets/logosk.png"
          alt="Second logo"
          style="height:35px;"
        />

        <span>
          <strong>Bukal Youth Data</strong>
          <small>Pagbilao, Quezon</small>
        </span>

      </a>

    </div>

  </header>


  <div class="auth-body">

    <main class="auth-shell">

      <section class="auth-card">

        <div class="auth-title center">

          <!-- USER ICON -->
          <span class="icon-badge">

            <svg
              class="auth-svg-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <circle
                cx="12"
                cy="8"
                r="4"
              ></circle>

              <path
                d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"
              ></path>

            </svg>

          </span>


          <h1>Login</h1>

          <p>
            Access your account
          </p>

        </div>


        <form
          id="loginForm"
          class="form-grid single"
        >

          <label class="field full">

            <span>Email</span>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />

          </label>


          <label class="field full">

            <span>Password</span>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />

          </label>


          <button
            type="submit"
            class="btn btn-primary full-btn"
          >
            Login
          </button>

        </form>


        <p class="center small-text">
          Don't have an account?
        </p>

        <p class="center small-text">

          <a href="youth-register.html">
            Register as Youth
          </a>

          ·

          <a href="admin-register.html">
            Register as Admin
          </a>

        </p>

      </section>

    </main>

  </div>


  <script
    type="module"
    src="assets/login.js"
  ></script>

</body>
</html>
