<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukal Youth Data | Admin Registration</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body data-page="admin-register">

  <!-- =========================
       HEADER
  ========================== -->
  <header class="site-header">

    <div class="container nav-wrap">

      <a class="brand" href="admin-dashboard.html" aria-label="Back to Admin Dashboard">

        <img src="assets/logo.png" alt="Bukal Youth Data logo" />

        <img src="assets/logosk.png" alt="Second logo" style="height:35px;" />

        <span>

          <strong>
            Bukal Youth Data
          </strong>

          <small>
            Pagbilao, Quezon
          </small>

        </span>

      </a>

    </div>

  </header>


  <!-- =========================
       ADMIN REGISTRATION
  ========================== -->
  <div class="auth-body">

    <main class="auth-shell">


      <!-- BACK TO ADMIN -->
      <a class="back-link" href="admin-dashboard.html">
        ← Back to Admin Dashboard
      </a>


      <section class="auth-card">


        <div class="auth-title center">


          <!-- ADMIN SHIELD ICON -->
          <span class="icon-badge">

            <svg class="auth-svg-icon" viewBox="0 0 24 24" aria-hidden="true">

              <path d="M12 3L20 6V11C20 16 16.6 20.2 12 22C7.4 20.2 4 16 4 11V6L12 3Z"></path>

              <path d="M9 12L11 14L15.5 9.5"></path>

            </svg>

          </span>


          <h1>
            Admin Registration
          </h1>


          <p>
            Create a new administrator account
          </p>

        </div>


        <!-- =========================
             INFORMATION MESSAGE
        ========================== -->
        <div class="summary-box" style="margin-bottom:20px;">

          <strong>
            Administrator Access
          </strong>

          <p class="muted-text" style="margin-top:6px;">
            Only an authenticated administrator can create
            another administrator account.
          </p>

        </div>


        <!-- =========================
             REGISTRATION FORM
        ========================== -->
        <form id="adminRegisterForm" class="form-grid single">


          <!-- FULL NAME -->
          <label class="field full">

            <span>
              Full Name
            </span>

            <input type="text" name="fullName" placeholder="Enter full name" autocomplete="name" required />

          </label>


          <!-- EMAIL -->
          <label class="field full">

            <span>
              Email
            </span>

            <input type="email" name="email" placeholder="admin@bukal.gov.ph" autocomplete="off" required />

          </label>


          <!-- PASSWORD -->
          <label class="field full">

            <span>
              Password
            </span>

            <input type="password" name="password" placeholder="Minimum 8 characters" minlength="8" autocomplete="new-password" required />

          </label>


          <!-- REGISTER BUTTON -->
          <button class="btn btn-primary full-btn" type="submit">
            Register as Admin
          </button>


          <p class="center small-text">

            This page is restricted to
            authenticated administrators.

          </p>


        </form>

      </section>

    </main>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <!--
    Verifies that the current logged-in user
    is an administrator.
  -->
  <script type="module" src="assets/admin-check.js"></script>


  <script type="module" src="assets/app.js"></script>


  <!--
    Creates the NEW admin using secondaryAuth
    while preserving the current admin session.
  -->
  <script type="module" src="assets/admin-register.js"></script>


</body>
</html>
