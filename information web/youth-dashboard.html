<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukal Youth Data | Youth Dashboard</title>
  <link rel="icon" type="image/png" href="assets/logo.jpg">
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/youth.css">
</head>
<body data-page="youth-dashboard" class="dashboard-body">
  <header class="dash-header">
    <div class="container dash-top">
      <div>
        <h1>Youth Dashboard</h1>
        <p id="youthWelcome">Welcome</p>
      </div>

      <button class="logout-btn" data-logout>↪ Logout</button>
    </div>
  </header>

  <main class="container dashboard-main">
    <section class="panel profile-panel">
      <div class="panel-heading profile-heading">
        <span class="profile-avatar"></span>

        <div>
          <h2>Your Profile</h2>
          <p>Manage your personal information</p>
        </div>

        <button class="btn btn-primary btn-sm right" id="editProfileBtn">✎ Edit Profile</button>
      </div>

      <div id="youthProfileView" class="profile-view"></div>
    </section>
  </main>

  <dialog id="profileDialog" class="modal-card">
    <form method="dialog" class="modal-inner" id="profileEditForm">
      <div class="modal-heading">
        <h2>Edit Youth Profile</h2>
        <button class="icon-btn" value="cancel" type="submit">×</button>
      </div>

      <div class="form-grid" id="profileEditFields"></div>

      <div class="modal-actions">
        <button class="btn btn-muted" value="cancel" type="submit">Cancel</button>
        <button class="btn btn-primary" id="saveProfileBtn" value="default" type="button">Save Changes</button>
      </div>
      <body class="dashboard-body">
  <div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2 class="logo">Bukal System</h2>
      <nav>
        <a href="#">Dashboard</a>
        <a href="#">Youth Records</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <!-- MAIN -->
    <div class="main-content">

      <!-- TOP BAR -->
      <header class="topbar">
        <h1>Admin Dashboard</h1>
        <button class="logout-btn">Logout</button>
      </header>

      <!-- STATS -->
      <section class="stats-grid">
        <div class="stat-card">Total Youth<br><strong>120</strong></div>
        <div class="stat-card">Male<br><strong>65</strong></div>
        <div class="stat-card">Female<br><strong>55</strong></div>
        <div class="stat-card">Students<br><strong>80</strong></div>
      </section>

      <!-- CHART -->
      <section class="panel">
        <h2>Youth Distribution</h2>
        <!-- chart here -->
      </section>

    </div>
  </div>
</body>
    </form>
  </dialog>

  <script type="module" src="assets/youth-check.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
