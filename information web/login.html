<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="icon" type="image/png" href="assets/logo.jpg">
  <link rel="stylesheet" href="assets/login.css">
</head>
<body>

<div class="wrapper">

  <a href="index.html" class="back">← Back to Home</a>

  <div class="container">
    <h2>Login</h2>
    <p class="subtitle">Access your account</p>

    <form id="loginForm">
      <div class="field">
        <input type="email"
        id="email"
         placeholder="Enter your email"
         required
         >
      </div>

      <div class="field">
      
        <input type="password" 
        id="password"
        placeholder="Enter your password"
        required
        >
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="links">
      <p>Don't have an account?</p>
      <a href="youth-register.html">Register as Youth</a>
      <a href="admin-register.html">Register as Admin</a>
    </div>

  </div>

</div>

</body>
<script type="module" src="assets/login.js"></script>
</html>
